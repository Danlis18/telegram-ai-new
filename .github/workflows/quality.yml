name: Production quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structural-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate production structure
        run: python scripts/quality_check.py
